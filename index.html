    </nav>
    <div class="rank" id="rankBox"></div>
    <div class="top-actions">
      <button id="btnSound" class="icon-btn" title="Activar o silenciar sonidos" aria-label="Sonido">🔊</button>
      <button id="btnVoice" class="icon-btn" title="Activar o desactivar la voz" aria-label="Voz">🗣️</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="small-screen-note">⌨️ Teclanauta se juega con un teclado físico. Abrila en una computadora para la mejor experiencia.</div>
